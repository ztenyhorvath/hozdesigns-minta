<script type="text/x-dc" id="dc-logic" data-props='{"accent":{"editor":"color","default":"#C9A46A","options":["#C9A46A","#B8B1A5","#D9A79A","#9DB4A0"]},"$preview":{"width":1440,"height":5200}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const q = new URLSearchParams(location.search).get('tab');
    this.state = { tpl: q === 'bor' ? 'bor' : 'kutya', sent: false, sending: false, failed: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#C9A46A';
    const s = this.state;
    const pill = (on) => on
      ? 'padding: 12px 18px; min-height: 44px; border-radius: 999px; border: 1.5px solid #121212; background: #121212; color: #F3F1EC; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit'
      : 'padding: 12px 18px; min-height: 44px; border-radius: 999px; border: 1.5px solid #8F887C; background: transparent; color: #121212; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit';
    const tabDefs = [['kutya', 'Kutyakozmetika'], ['bor', 'Borászat']];
    return {
      accent,
      accentText: '#8A6A35',
      tabs: tabDefs.map(([id, label]) => ({ label, selected: s.tpl === id ? 'true' : 'false', style: pill(s.tpl === id), pick: () => this.setState({ tpl: id }) })),
      is_kutya: s.tpl === 'kutya', is_bor: s.tpl === 'bor',
      sent: s.sent, notSent: !s.sent,
      failed: s.failed,
      btnLabel: s.sending ? 'Küldés…' : 'Ajánlatot kérek',
      send: (e) => {
        e.preventDefault();
        if (s.sending) return;
        const form = e.target;
        this.setState({ sending: true, failed: false });
        fetch('https://api.web3forms.com/submit', { method: 'POST', headers: { 'Accept': 'application/json' }, body: new FormData(form) })
          .then(r => r.json())
          .then(j => { if (j && j.success) { this.setState({ sent: true, sending: false }); } else { this.setState({ failed: true, sending: false }); } })
          .catch(() => this.setState({ failed: true, sending: false }));
      }
    };
  }
}
</script>
