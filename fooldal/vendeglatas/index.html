[style*="gap: 56px"],[style*="gap: 48px"]{gap:28px !important}
[style*="gap: 40px"]{gap:24px !important}

[style*="padding: 48px"]{padding:24px !important}
[style*="padding: 40px 36px"],[style*="padding: 36px"]{padding:24px !important}
[style*="padding: 32px"]{padding:20px !important}

[style*="minmax(220px, 1fr)"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important}

<style>
.case{display:flex;flex-direction:column;gap:32px}

<a href="/" aria-label="hozdesigns – főoldal" style="display: flex; align-items: center; text-decoration: none">
<img src="/img/logo.png" alt="H designs logó" style="width: 48px; height: 48px; display: block"></a>
<span style="font-size: 15px; color: #5A5248"><a href="/" style="color: #5A5248; text-decoration: none">Főoldal</a> / <b style="color: #121212; font-weight: 600">Vendéglátás</b></span>
</div>
<nav aria-label="Fő menü" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-weight: 500; font-size: 15px">

<a class="navlink" href="#sablonok" style="padding: 12px 14px; text-decoration: none">Sablonok</a>

</nav>
</header>

<section id="top" style="max-width: 1240px; margin: 0 auto; padding: 40px 24px 64px; display: flex; flex-direction: column; gap: 28px">
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #5A5248">Webdizájn éttermeknek, kávézóknak, pékségeknek · Budapest</p>
<h1 style="margin: 0; font-family: 'Geist', sans-serif; font-weight: 600; letter-spacing: -0.03em; font-size: clamp(44px, 6.4vw, 96px); line-height: 0.98; letter-spacing: -0.035em; max-width: 1120px">Weboldal, ami asztalt foglal, <span style="color: {{accentText}}">süteményt</span> mutat és vendéget hoz.</h1>
<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end; justify-content: space-between">
<p style="margin: 0; font-size: 19px; line-height: 1.6; max-width: 560px">10 éve dolgozom az e-commerce és a webdizájn világában. Abban szeretnék segíteni a magyar kisvállalkozásoknak, hogy online is olyan színvonalon jelenjenek meg, amilyet megérdemelnek – mert egy jó weboldal mindig többet mond el Rólatok, mint egy Facebook-oldal.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="#sablonok" style="padding: 16px 28px; background: #121212; color: #F3F1EC; text-decoration: none; border-radius: 999px; font-weight: 600">Sablonok megtekintése</a>
<a href="#munkak" style="padding: 16px 28px; border: 1.5px solid #121212; text-decoration: none; border-radius: 999px; font-weight: 600">Munkáim</a>
</div>
</div>
<div style="margin-top: 32px; background: #121212; color: #F3F1EC; border-radius: 28px; overflow: hidden">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr))">
<div class="stat" style="padding: 40px 36px; display: flex; flex-direction: column; gap: 14px; border-right: 1px solid #2E2B27">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #9C958A">Tapasztalat</span>
<span class="num" style="font-family: 'Geist', sans-serif; font-weight: 600; font-size: clamp(72px, 8vw, 120px); letter-spacing: -0.06em; line-height: 0.85">10<span style="font-size: 0.32em; letter-spacing: -0.02em; margin-left: 6px; color: {{accent}}">év</span></span>
<span style="font-size: 15px; color: #DCD6CB">webdizájnban, most vendéglátásra szabva</span>
</div>
<div class="stat" style="padding: 40px 36px; display: flex; flex-direction: column; gap: 14px; border-right: 1px solid #2E2B27">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #9C958A">Átfutás</span>
<span class="num" style="font-family: 'Geist', sans-serif; font-weight: 600; font-size: clamp(72px, 8vw, 120px); letter-spacing: -0.06em; line-height: 0.85">1–3<span style="font-size: 0.32em; letter-spacing: -0.02em; margin-left: 6px; color: {{accent}}">hét</span></span>
<span style="font-size: 15px; color: #DCD6CB">az első egyeztetéstől az élesítésig</span>
</div>
<div class="stat" style="padding: 40px 36px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #9C958A">Gondozás</span>
<span class="num" style="font-family: 'Geist', sans-serif; font-weight: 600; font-size: clamp(72px, 8vw, 120px); letter-spacing: -0.06em; line-height: 0.85">2<span style="font-size: 0.32em; letter-spacing: -0.02em; margin-left: 6px; color: {{accent}}">óra/hó</span></span>
<span style="font-size: 15px; color: #DCD6CB">frissítés és módosítás, minden hónapban</span>
</div>
</div>
</div>

<section id="munkak" style="background: #121212; color: #F3F1EC">

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">

<article class="case">

<div style="display: flex; flex-direction: column; gap: 10px">

<h3 class="case-title">Csáklit</h3>
</div>
<a class="lift" href="https://csaklitkavehaz.hu" target="_blank" rel="noopener" style="padding: 18px 30px; background: #F3F1EC; color: #121212; text-decoration: none; border-radius: 999px; font-weight: 600; font-size: 16px">csaklitkavehaz.hu megnyitása ↗</a>
</div>
<div class="case-shots">
<a class="case-desk zoomwrap" href="https://csaklitkavehaz.hu" target="_blank" rel="noopener" aria-label="A Csáklit Kávéház főoldala"><img class="zoomimg" src="/img/hz-case-csaklit-d.webp?v=2" alt="A Csáklit Kávéház weboldalának főoldala: reggeli minden nap 15 óráig, a mai heti menüvel" width="1600" height="1000" loading="lazy"></a>
<div class="case-phone"><img src="/img/hz-case-csaklit-m.webp?v=2" alt="A főoldal telefonon" width="780" height="1688" loading="lazy"></div>

<section id="sablonok" style="max-width: 1240px; margin: 0 auto; padding: 72px 24px; display: flex; flex-direction: column; gap: 32px">

<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #4A453E">Minden sablon a te helyed fotóival, színeivel és szövegeivel készül el. Válaszd ki a helytípust, és nézd meg, mit tud.</p>

<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #B8B1A5"></span>
<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #B8B1A5"></span>
<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #B8B1A5"></span>
<span style="margin-left: 12px; font-size: 13px; color: #4A453E">pekseged.hu · minta</span>

<div class="zoomwrap" style="aspect-ratio: 1; border-radius: 8px; overflow: hidden"><img class="zoomimg" src="/img/hz-mood_shop.webp" alt="Fotó: pékség hangulatkép" style="width: 100%; height: 100%; object-fit: cover; display: block"></div>

<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #B8B1A5"></span>
<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #B8B1A5"></span>

<script type="text/x-dc" id="dc-logic" data-props='{"accent":{"editor":"color","default":"#C9A46A","options":["#C9A46A","#B8B1A5","#D9A79A","#9DB4A0"]},"$preview":{"width":1440,"height":5200}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tpl: (['pek', 'etterem', 'kave', 'egyeb'].indexOf(new URLSearchParams(location.search).get('tab')) >= 0 ? new URLSearchParams(location.search).get('tab') : 'pek'), day: 0, slot: 2, persons: 2, booked: false, sent: false, sending: false, failed: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#C9A46A';
    const s = this.state;
    const pill = (on) => on
      ? 'padding: 12px 18px; min-height: 44px; border-radius: 999px; border: 1.5px solid #121212; background: #121212; color: #F3F1EC; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit'
      : 'padding: 12px 18px; min-height: 44px; border-radius: 999px; border: 1.5px solid #8F887C; background: transparent; color: #121212; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit';
    const tabDefs = [['pek', 'Pékség'], ['etterem', 'Étterem'], ['kave', 'Kávézó & brunch'], ['egyeb', 'Egyéb']];
    const dayDefs = ['Ma', 'Holnap', 'Szombat', 'Vasárnap'];
    const slotDefs = ['12:00', '13:00', '18:00', '19:00', '19:30', '20:30'];
    return {
      accent,
      accentText: '#8A6A35',
      tabs: tabDefs.map(([id, label]) => ({ label, selected: s.tpl === id ? 'true' : 'false', style: pill(s.tpl === id), pick: () => this.setState({ tpl: id }) })),
      isPek: s.tpl === 'pek', isEtterem: s.tpl === 'etterem', isKave: s.tpl === 'kave', isEgyeb: s.tpl === 'egyeb',
      cakes: [
        { name: 'Pisztáciás croissant', price: '1 290 Ft', desc: 'Szicíliai pisztáciakrém, vajas leveles tészta.', img: '/img/hz-croissant.webp' },
        { name: 'Kardamomos csiga', price: '890 Ft', desc: 'Svéd recept, frissen őrölt kardamommal.', img: '/img/hz-cardamom.webp' },
        { name: 'Szezonális gyümölcstorta', price: '14 900 Ft', desc: 'Egész tortaként is rendelhető, 48 órával előre.', img: '/img/hz-tart.webp' }
      ],
      days: dayDefs.map((label, i) => ({ label, selected: s.day === i ? 'true' : 'false', style: pill(s.day === i), pick: () => this.setState({ day: i }) })),
      slots: slotDefs.map((label, i) => ({ label, selected: s.slot === i ? 'true' : 'false', style: pill(s.slot === i), pick: () => this.setState({ slot: i }) })),
      persons: s.persons,
      minus: () => this.setState({ persons: Math.max(1, s.persons - 1) }),
      plus: () => this.setState({ persons: Math.min(12, s.persons + 1) }),
      summary: dayDefs[s.day] + ', ' + slotDefs[s.slot] + ' · ' + s.persons + ' fő',
      book: () => this.setState({ booked: true }),
      reset: () => this.setState({ booked: false }),
      booked: s.booked, notBooked: !s.booked,
      posts: [
        { label: 'flat white', img: '/img/hz-ig_flatwhite.webp' }, { label: 'brunch tál', img: '/img/hz-ig_shakshuka.webp' }, { label: 'terasz', img: '/img/hz-ig_terrace.webp' },
        { label: 'croissant', img: '/img/hz-ig_croissants.webp' }, { label: 'barista', img: '/img/hz-ig_pour.webp' }, { label: 'reggeli fény', img: '/img/hz-ig_corner.webp' }
      ],
      sent: s.sent, notSent: !s.sent,
      failed: s.failed,
      btnLabel: s.sending ? 'Küldés…' : 'Ajánlatot kérek',
      send: (e) => {
        e.preventDefault();
        if (s.sending) return;
        const form = e.target;
        this.setState({ sending: true, failed: false });
        fetch('https://api.web3forms.com/submit', { method: 'POST', headers: { 'Accept': 'application/json' }, body: new FormData(form) })
          .then(r => r.json())
          .then(j => { if (j && j.success) { this.setState({ sent: true, sending: false }); } else { this.setState({ failed: true, sending: false }); } })
          .catch(() => this.setState({ failed: true, sending: false }));
      }
    };
  }
}
</script>

<script>

});
</script>
